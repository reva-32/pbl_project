name: Package MSME-360 source
on:
  push:
    branches:
      - fix/secure-channel-integration-preserve-original
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        shell: bash
        run: |
          zip -r msme360-source.zip . \
            -x ".git/*" "*/node_modules/*" "node_modules/*" \
               "*/dist/*" "dist/*" "*/.env" ".env" "*/.env.*" \
               "*/coverage/*" "*/.DS_Store" "*.log"
      - uses: actions/upload-artifact@v4
        with:
          name: msme360-source
          path: msme360-source.zip
          retention-days: 3
